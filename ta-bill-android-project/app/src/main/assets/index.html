<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TA Bill</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#c7292a">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TA Bill">
<style>
:root{--bg:#fbf5ea;--card:#fff;--tx:#2a1b1b;--mu:#7a6a6a;--ac:#c7292a;--hx:#b01f21;--yl:#ffd100;--bd:#ead9c4;--lk:#b01f21;--ok:#1e7a46;--wr:#b4540a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1415;--card:#2a1f20;--tx:#f4ecec;--mu:#bba9a9;--hx:#ff9a9c;--bd:#4b3a3b;--lk:#ffd100;--ok:#5fd08e;--wr:#f0a05a}}
:root[data-theme="dark"]{--bg:#1b1415;--card:#2a1f20;--tx:#f4ecec;--mu:#bba9a9;--hx:#ff9a9c;--bd:#4b3a3b;--lk:#ffd100;--ok:#5fd08e;--wr:#f0a05a}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ac)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:70px;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.hd{background:var(--ac);border-bottom:4px solid var(--yl);padding:8px 12px;display:flex;align-items:center;gap:12px;color:#fff}
.hd img{height:46px;border-radius:4px;display:block}
.hd b{display:block;font-size:18px;letter-spacing:.3px}
.hd span{font-size:12px;color:#ffe680}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:12px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:17px;color:var(--hx);border-bottom:2px solid var(--yl);padding-bottom:4px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yl);border-color:var(--ac)}
textarea{min-height:70px}
.r{display:flex;gap:8px}.r>*{flex:1;min-width:0}
button.p{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:12px;box-shadow:inset 0 -3px 0 var(--yl)}
button.s{width:auto;padding:5px 10px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:3px solid var(--ac);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;border-radius:0;background:none;padding:13px 4px;color:var(--mu);font-size:13px}
nav button.on{color:var(--hx);font-weight:700;box-shadow:inset 0 3px 0 var(--yl)}
.day{font-weight:700;margin:10px 0 4px;display:flex;justify-content:space-between;color:var(--hx)}
.tag{font-size:12px;color:var(--ok)}.warn{color:var(--wr);font-size:12px}
.trip{border-top:1px solid var(--bd);padding:8px 0;font-size:14px}
.mu{color:var(--mu);font-size:12px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:11px;min-width:720px}
td,th{border:1px solid #888;padding:3px;vertical-align:top}
.bill{background:#fff;color:#000;padding:10px;border-radius:8px}
.bill td,.bill th{border-color:#000}
.hide{display:none}
@media print{html{background:#fff}body{background:#fff;padding:0;min-height:0}nav,.noprint{display:none!important}.card{border:0;padding:0}.bill{padding:0}.sc{overflow:visible}table{min-width:0}}
</style>
